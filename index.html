<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nemours Estate — Virtual Postcard</title>
<style>
  :root{
    --paper:#efe8da;
    --paper-dark:#e2d9c6;
    --ink:#2b3a55;
    --ink-soft:#4a5a78;
    --rule:#9a8f78;
    --stamp-red:#a13d2b;
    --forest:#3f5b45;
    --shadow:rgba(35,28,15,0.35);
    --serif: 'Playfair Display', Georgia, serif;
    --hand: 'Caveat', cursive;
    --type: 'Special Elite', 'Courier New', monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Caveat:wght@500;600&family=Special+Elite&display=swap');
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:40px 16px 80px;
    background:#1f2a24;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.03), transparent 40%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    font-family: var(--type);
    color:#eee6d3;
  }
  h1.site-title{
    font-family: var(--serif);
    font-weight:700;
    font-size:26px;
    letter-spacing:0.5px;
    color:#eee6d3;
    margin:0 0 4px;
    text-align:center;
  }
  p.site-sub{
    font-family: var(--type);
    font-size:12px;
    color:#b9ad92;
    margin:0 0 28px;
    text-transform:uppercase;
    letter-spacing:2px;
    text-align:center;
  }
  .stage{
    perspective:2400px;
    width:100%;
    max-width:720px;
  }
  .postcard{
    position:relative;
    width:100%;
    aspect-ratio: 3 / 2;
    transform-style:preserve-3d;
    transition:transform 0.9s cubic-bezier(.4,.2,.2,1);
  }
  .postcard.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:6px;
    box-shadow: 0 18px 40px var(--shadow), 0 2px 0 rgba(255,255,255,0.4) inset;
    overflow:hidden;
    background:var(--paper);
  }
  .face.front{
    background:#000;
    cursor:pointer; 
  }
  .face.front img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .front .caption{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:10px 16px;
    background:linear-gradient(to top, rgba(0,0,0,0.55), transparent);
    color:#f4efe2;
    font-family:var(--serif);
    font-size:15px;
    letter-spacing:0.5px;
  }
  .face.back{
    transform:rotateY(180deg);
    background:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0,0,0,0.05) 40px),
      var(--paper);
    display:flex;
    padding:5%;
  }
  .back-left{
    width:52%;
    padding-right:4%;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .printed-address{
    font-family:var(--hand);
    color:var(--ink);
    font-size:clamp(16px, 3.4vw, 22px);
    line-height:1.25;
    margin-bottom:14px;
  }
  .msg-area{
    flex:1;
    width:100%;
    resize:none;
    border:none;
    outline:none;
    background:transparent;
    font-family:var(--hand);
    color:#1e3a6b;
    font-size:clamp(12px, 2.5vw, 17px);
    line-height:1.5;
    padding-top:2px;
  }
  .divider{
    width:1px;
    background:var(--ink-soft);
    opacity:0.6;
    margin:0 2%;
  }
  .back-right{
    width:48%;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .stamp-box{
    align-self:flex-end;
    width:34%;
    aspect-ratio:1/1;
    border:2px dashed var(--stamp-red);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    padding:4px;
    position:relative;
  }
  .stamp-box img{ width:100%; height:100%; }
  .to-lines{
    margin-top:auto;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .to-line{
    border-bottom:1px solid var(--rule);
    height:1px;
    position:relative;
  }
  .to-line input{
    position:absolute;
    bottom:2px;
    left:0;
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    font-family:var(--hand);
    font-size:16px;
    color:var(--ink);
  }
  .link-button-container {
    margin-top: 20px;
    text-align: center;
  }
  .link-button {
    display: inline-block;
    font-family: var(--type);
    font-size: 14px;
    letter-spacing: 0.5px;
    background: var(--stamp-red);
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
    padding: 12px 20px;
    transition: background 0.15s, transform 0.1s;
    cursor: pointer;
    box-shadow: 0 4px 6px var(--shadow);
  }
  .link-button:hover {
    background: #c04a34;
  }
  .link-button:active {
    transform: scale(0.97);
  }
</style>
</head>
<body>

<h1 class="site-title">Nemours Estate</h1>
<p class="site-sub">Wilmington, Delaware</p>

<div class="stage">
  <div class="postcard" id="postcard">
    
    <!-- Mặt trước (Front) -->
    <div class="face front" onclick="flipPostcard()">
      <!-- Dán chuỗi ảnh base64 vào thuộc tính src dưới đây -->
      <img src="data:image/jpeg;base64,... " alt="Nemours Estate">
      <div class="caption">Nemours Estate</div>
    </div>
    
    <!-- Mặt sau (Back) -->
    <div class="face back">
      <div class="back-left">
        <div class="printed-address">Greetings from Delaware!</div>
        <textarea class="msg-area">Wilmington, DE 28/07/2026

Hôm nay anh có cơ hội đi đến Dinh Thư Nemours và thăm New Castle.  Dinh thự Nemours được xây dựng từ năm 1909-1910, như món quà dành cho người vợ thứ hai của Alfred. du Pont - Alicia. Xuôi về hướng nam Wilmington khoảng 10 phút sẽ tới New Castle. Nếu Wilmington là nơi nhà DuPont lập nghiệp trên nước Mỹ, thì New Castle là thủ đô đầu tiên của tiểu bang Delaware.Tại New Castle, người ta còn giữ lại một phần con đường lát đá cuội của thế kỷ 18. 

Anh mong em sẽ cảm nhận được một phần lịch sử của "Tiểu Bang đầu tiên của nước Mỹ" cô dộng qua những bức ảnh này.</textarea>
      </div>
      
      <div class="divider"></div>
      
      <div class="back-right">
        <div class="stamp-box">
          <!-- Icon tem thư -->
        </div>
        
        <div class="to-lines">
          <div class="to-line"><input type="text" placeholder="My Special"></div>
          <div class="to-line"><input type="text" placeholder="Thi Huynh"></div>
          <div class="to-line"><input type="text" placeholder=""></div>
        </div>
        
        <!-- NÚT LINK THAY THẾ CHO QR CODE -->
        <div class="link-button-container">
          <!-- Thay đổi đường link trong thẻ href bên dưới -->
          <a href="https://anguyen1601.github.io/Nemours_Estate/album.html" target="_blank" class="link-button">
            Click to view Album
          </a>
        </div>
      </div>
    </div>
    
  </div>
</div>

<!-- Nút lật thiệp bên ngoài -->
<div style="text-align:center; margin-top:20px;">
  <button onclick="flipPostcard()" style="padding:10px 20px; font-family:var(--type); cursor:pointer;">Flip Postcard</button>
</div>

<script>
  function flipPostcard() {
    const postcard = document.getElementById('postcard');
    postcard.classList.toggle('flipped');
  }
</script>

</body>
</html>
