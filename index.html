<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Photo Album — Nemours Estate</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Playfair+Display:ital,wght@0,400;1,600&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #f0eadd;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh; 
    overflow: hidden; 
    font-family: 'Playfair Display', serif;
  }

  .album-music {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
  }

  .album-scene {
    perspective: 1500px;
    width: 900px;
    height: 600px;
    position: relative;
    display: flex;
  }

  .page-right {
    position: absolute;
    right: 0;
    width: 50%;
    height: 100%;
    background-color: #fdfbf7;
    box-shadow: inset 5px 0 15px rgba(0,0,0,0.1), 10px 10px 20px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    padding: 15px 25px;
    border-radius: 0 8px 8px 0;
    z-index: 1;
    border-left: 2px solid #e3dec9; 
  }

  .leaf {
    position: absolute;
    right: 0; 
    width: 50%;
    height: 100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
    cursor: pointer;
  }

  .leaf.flipped {
    transform: rotateY(-180deg);
  }

  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 0 8px 8px 0;
  }

  .face.front {
    background-color: #fdfbf7;
    display: flex;
    flex-direction: column;
    padding: 15px 25px;
    box-shadow: inset 5px 0 15px rgba(0,0,0,0.1);
    border-left: 2px solid #e3dec9; 
  }

  .face.front.cover {
    background-color: #F8C39F; 
    align-items: center;
    justify-content: center;
    padding: 0;
    box-shadow: inset 5px 0 15px rgba(0,0,0,0.3), 5px 5px 15px rgba(0,0,0,0.4);
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.02) 75%, rgba(255,255,255,0.02)), 
                      repeating-linear-gradient(-45deg, rgba(255,255,255,0.02) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.02) 75%, rgba(255,255,255,0.02));
    background-size: 4px 4px;
    border-left: none;
  }

  .spiral-binding {
    position: absolute;
    left: -15px;
    top: 2%;
    height: 96%;
    width: 30px;
    background: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 15px,
      #b8860b 15px,
      #8b6508 20px,
      transparent 20px,
      transparent 30px
    );
    z-index: 10;
  }

  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 3px solid #d4af37;
  }
  .corner-top-right { top: 10px; right: 10px; border-bottom: none; border-left: none; }
  .corner-bottom-right { bottom: 10px; right: 10px; border-top: none; border-left: none; }

  .cover-photo-slot {
    width: 75%;
    aspect-ratio: 4/3;
    background: #000;
    margin-bottom: 25px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
  }
  .cover-photo-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer;
  }
  
  .cover-title {
    color: #ffffff; 
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    font-size: 18px; 
    letter-spacing: 4px; 
    text-transform: uppercase;
    text-align: center;
    width: 100%;
    line-height: 1.5; 
  }

  .cover-date-input {
    background: transparent;
    border: none;
    color: #ffffff;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    letter-spacing: 3px;
    text-align: center;
    margin-top: 15px;
    outline: none;
    width: 80%;
  }

  .face.back {
    background-color: #fdfbf7;
    transform: rotateY(180deg);
    box-shadow: inset -5px 0 15px rgba(0,0,0,0.1);
    border-radius: 8px 0 0 8px;
    display: flex;
    flex-direction: column;
    padding: 15px 25px;
    border-left: none;
  }

  .travel-tag {
    position: absolute;
    top: 15px;
    right: 25px;
    font-family: 'Caveat', cursive;
    font-size: 22px; 
    color: #C4673B; 
    font-weight: bold;
    z-index: 5;
    pointer-events: none;
  }
  .face.back .travel-tag {
    left: 25px; 
    right: auto;
  }
  
  .layout-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 10px;
    width: 100%;
    height: 100%;
    margin-top: 25px;
  }

  .top-section, .bottom-section {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .photo-frame {
    background: #fff;
    padding: 8px 8px 22px 8px;
    box-shadow: 2px 4px 10px rgba(0,0,0,0.15);
    width: 48%;
    transform: rotate(-2deg);
    transition: transform 0.3s;
  }
  .photo-frame:nth-child(even) {
    transform: rotate(2deg);
  }
  .photo-frame:hover {
    transform: rotate(0deg) scale(1.05);
    z-index: 10;
  }
  
  .photo-frame img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    background: #e0e0e0;
    cursor: pointer;
  }

  .text-block {
    width: 48%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 5px;
  }

  .page-title {
    font-family: 'Caveat', cursive;
    font-size: 20px; 
    color: #333;
    border: none;
    background: transparent;
    outline: none;
    margin-bottom: 5px;
    text-align: center;
  }

  .scrapbook-text {
    font-family: 'Dancing Script', cursive;
    font-size: 15px; 
    color: #555;
    background: transparent;
    border: none;
    resize: none;
    width: 100%;
    height: 120px;
    outline: none;
    line-height: 1.3; 
    text-align: center;
    overflow: hidden; 
  }

  .photo-frame, .text-block, .cover-date-input, .cover-title {
    cursor: default; 
  }
  .photo-frame img, .cover-photo-slot img {
    cursor: pointer; 
  }

  .loading-overlay {
    position: absolute;
    inset: 0;
    background: #f0eadd;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #333;
    z-index: 9999;
  }

  .modal {
    visibility: hidden;
    opacity: 0;
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  .modal.active {
    visibility: visible;
    opacity: 1;
  }
  .modal-content {
    max-width: 85%;
    max-height: 85%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    border: 8px solid #fff;
    border-radius: 4px;
    transform: scale(0.8);
    transition: transform 0.3s ease;
    object-fit: contain;
  }
  .modal.active .modal-content {
    transform: scale(1);
  }
  .close-btn {
    position: absolute;
    top: 20px;
    right: 40px;
    color: #fff;
    font-size: 50px;
    font-weight: bold;
    cursor: pointer;
    transition: color 0.2s;
  }
  .close-btn:hover {
    color: #d4af37;
  }
</style>
</head>
<body>

<audio class="album-music" controls autoplay loop>
  <source src="backgroudmusic.mp3" type="audio/mpeg">
</audio>

<div class="album-scene" id="album">
  <div class="loading-overlay" id="loading">Đang tải album ảnh từ GitHub...</div>
</div>

<div id="imageModal" class="modal" onclick="closeModal()">
  <span class="close-btn">&times;</span>
  <img class="modal-content" id="modalImg">
</div>

<script>
/* Cấu hình kết nối kho ảnh GitHub */
const GITHUB_OWNER  = "anguyen1601";
const GITHUB_REPO   = "Nemours_Estate";
const GITHUB_BRANCH = "main";
const GITHUB_PATH   = "images";
const COVER_IMAGE   = `${GITHUB_PATH}/cover.jpg`;
const ALBUM_TITLE   = "Nemours Estate";

const apiUrl  = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}?ref=${GITHUB_BRANCH}`;
const rawBase = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}`;

let currentZ = 20;
let photos = [];

async function initAlbum() {
  const albumContainer = document.getElementById('album');
  const loadingEl = document.getElementById('loading');

  try {
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error('Không thể tải từ GitHub API');
    const files = await res.json();
    
    photos = files
      .filter(f => f.type === 'file' && /\.(jpe?g|png|webp)$/i.test(f.name) && f.name.toLowerCase() !== 'cover.jpg')
      .sort((a, b) => a.name.localeCompare(b.name))
      .map(f => ({
        src: `${rawBase}/${GITHUB_PATH}/${f.name}`,
        caption: f.name.replace(/\.[^.]+$/, '').replace(/_/g, ' ')
      }));
  } catch (err) {
    loadingEl.textContent = 'Lỗi tải dữ liệu hình ảnh từ GitHub!';
    console.error(err);
    return;
  }

  const coverObj = { src: `${rawBase}/${COVER_IMAGE}`, caption: ALBUM_TITLE };
  
  // Tách riêng bức ảnh cuối cùng để làm trang bìa sau cùng
  let lastPhoto = coverObj;
  if (photos.length > 0) {
      lastPhoto = photos.pop();
  }

  // Xóa màn hình loading
  loadingEl.remove();

  // 1. Tạo Trang Cố Định Phía Sau Cùng (Fixed Back Page) chuẩn form New York
  const fixedBack = document.createElement('div');
  fixedBack.className = 'page-right';
  fixedBack.innerHTML = `
    <div class="travel-tag">The End</div>
    <div class="layout-grid" style="grid-template-rows: auto 1fr;">
      <div class="top-section" style="justify-content: center; margin-top: 10px;">
        <div class="photo-frame" style="width: 60%; transform: rotate(0deg); padding: 8px 8px 25px 8px;">
          <img src="${lastPhoto.src}" alt="${lastPhoto.caption}" class="zoomable" style="aspect-ratio: 3/4;">
        </div>
      </div>
      <div class="bottom-section" style="justify-content: center; align-items: flex-start; margin-top: 15px;">
        <div class="text-block" style="width: 85%;">
          <input type="text" class="page-title" value="Kỷ Niệm Đẹp" readonly>
          <textarea class="scrapbook-text" readonly>Chuyến đi khép lại tại đây. Những khoảnh khắc tuyệt vời sẽ còn giữ mãi!</textarea>
        </div>
      </div>
    </div>
  `;
  albumContainer.appendChild(fixedBack);

  // 2. Chia nhỏ danh sách ảnh còn lại để phân vào các Leaf
  let photoPairs = [];
  for (let i = 0; i < photos.length; i += 2) {
    photoPairs.push(photos.slice(i, i + 2));
  }

  if (photoPairs.length === 0) photoPairs.push([]);

  let leafCount = Math.ceil((photoPairs.length + 1) / 2);
  let pairIndex = 0;

  for (let l = 1; l <= leafCount; l++) {
    const leafId = `leaf${l}`;
    const leafEl = document.createElement('div');
    leafEl.className = 'leaf';
    leafEl.id = leafId;
    // Set z-index để trang bìa luôn nằm trên cùng
    leafEl.style.zIndex = leafCount - l + 10;

    let frontHTML = '';
    let backHTML = '';

    // Mặt trước (Front)
    if (l === 1) {
      frontHTML = `
        <div class="face front cover" onclick="flipLeaf('${leafId}', true, event)">
          <div class="spiral-binding"></div>
          <div class="corner corner-top-right"></div>
          <div class="corner corner-bottom-right"></div>
          <div class="cover-photo-slot">
            <img src="${coverObj.src}" alt="${ALBUM_TITLE}" class="zoomable">
          </div>
          <h1 class="cover-title">${ALBUM_TITLE}</h1>
          <input type="text" class="cover-date-input" value="Delaware — Photo Album" readonly>
        </div>
      `;
    } else {
      const pair = photoPairs[pairIndex++] || [];
      frontHTML = `
        <div class="face front" onclick="flipLeaf('${leafId}', true, event)">
          <div class="travel-tag">Khám Phá</div>
          ${renderLayoutGrid(pair)}
        </div>
      `;
    }

    // Mặt sau (Back)
    const backPair = photoPairs[pairIndex++] || [];
    backHTML = `
      <div class="face back" onclick="flipLeaf('${leafId}', false, event)">
        <div class="travel-tag">Kỷ Niệm</div>
        ${renderLayoutGrid(backPair)}
      </div>
    `;

    leafEl.innerHTML = frontHTML + backHTML;
    albumContainer.appendChild(leafEl);
  }

  // Đăng ký sự kiện xem ảnh cho toàn bộ ảnh vừa tạo
  document.querySelectorAll('.zoomable').forEach(img => {
    img.addEventListener('click', function(e) {
      e.stopPropagation(); 
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = this.src;
      modal.classList.add('active');
    });
  });
}

function renderLayoutGrid(pair) {
  const item1 = pair[0];
  const item2 = pair[1];

  // Bố cục xen kẽ trái phải chuẩn form New York
  return `
    <div class="layout-grid">
      <div class="top-section">
        ${item1 ? `
          <div class="photo-frame"><img src="${item1.src}" alt="${item1.caption}" class="zoomable"></div>
          <div class="text-block">
            <input type="text" class="page-title" value="${item1.caption}" readonly>
            <textarea class="scrapbook-text" readonly>Góc chụp tuyệt đẹp tại ${item1.caption}.</textarea>
          </div>
        ` : ''}
      </div>
      <div class="bottom-section">
        ${item2 ? `
          <div class="text-block">
            <input type="text" class="page-title" value="${item2.caption}" readonly>
            <textarea class="scrapbook-text" readonly>Khoảnh khắc lưu giữ tại ${item2.caption}.</textarea>
          </div>
          <div class="photo-frame"><img src="${item2.src}" alt="${item2.caption}" class="zoomable"></div>
        ` : ''}
      </div>
    </div>
  `;
}

function flipLeaf(leafId, forward, event) {
  if (event) {
    if (
      event.target.closest('.photo-frame') ||
      event.target.closest('.text-block') ||
      event.target.closest('.cover-photo-slot') ||
      ['input', 'textarea', 'img'].includes(event.target.tagName.toLowerCase())
    ) {
      return; 
    }
    event.stopPropagation(); 
  }

  const music = document.querySelector('.album-music');
  if (music && music.paused) {
    music.volume = 0.4;
    music.play().catch(error => console.log("Playback error:", error));
  }

  const leaf = document.getElementById(leafId);
  currentZ++;
  leaf.style.zIndex = currentZ;

  if (forward) {
    leaf.classList.add('flipped');
  } else {
    leaf.classList.remove('flipped');
  }
}

function closeModal() {
  document.getElementById('imageModal').classList.remove('active');
}

document.addEventListener('DOMContentLoaded', () => {
  const music = document.querySelector('.album-music');
  if (music) {
    music.volume = 0.4; 
    const startOnInteraction = () => {
      music.play().catch(() => {});
      document.removeEventListener('click', startOnInteraction);
      document.removeEventListener('keydown', startOnInteraction);
    };
    document.addEventListener('click', startOnInteraction);
    document.addEventListener('keydown', startOnInteraction);
  }
  initAlbum();
});
</script>

</body>
</html>
