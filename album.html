  // Rút phần tử cuối cùng để làm trang cuối
  let lastPhoto = photos.pop();

  // 1. Tạo Trang Cố Định Phía Sau Cùng (Fixed Back Page)
  const fixedBack = document.createElement('div');
  fixedBack.className = 'page-right';
  fixedBack.innerHTML = `
    <div class="travel-tag">Hoàn tất</div>
    <div class="layout-grid" style="grid-template-rows: auto 1fr;">
      <div class="top-section" style="justify-content: center; margin-top: 10px;">

      <div class="bottom-section" style="justify-content: center; align-items: flex-start; margin-top: 15px;">
        <div class="text-block" style="width: 85%;">
          <input type="text" class="page-title" value="${lastPhoto.caption}" readonly>
          <textarea class="scrapbook-text" readonly>${lastPhoto.desc}</textarea>

      </div>

  albumContainer.appendChild(fixedBack);

  // 2. Chia nhỏ danh sách ảnh còn lại để phân vào các Leaf
  let photoPairs = [];
  for (let i = 0; i < photos.length; i += 2) {
    photoPairs.push(photos.slice(i, i + 2));
  }

  let leafCount = Math.ceil((photoPairs.length + 1) / 2);
  let pairIndex = 0;

  for (let l = 1; l <= leafCount; l++) {

async function loadAlbum() {
  try {
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error('GitHub API error ' + res.status);
    const files = await res.json();
    photos = files
      .filter(f => f.type === 'file' && /\.(jpe?g|png|webp)$/i.test(f.name) && f.name.toLowerCase() !== 'cover.jpg')
      .sort((a, b) => a.name.localeCompare(b.name))
      .map(f => ({ src: `${rawBase}/${GITHUB_PATH}/${f.name}`, caption: f.name.replace(/\.[^.]+$/, '').replace(/_/g, ' ') }));
  } catch (err) {
    statusEl.textContent = 'Could not load images from GitHub.';
    console.error(err);
    return;
  }

  if (photos.length === 0) {
    statusEl.textContent = 'No photos found in ' + GITHUB_PATH;
    return;
  }

  coverImg = { src: `${rawBase}/${COVER_IMAGE}` };

  spreads.push({ isCover: true });
  spreads.push({ left: null, right: photos[0] });
  const rest = photos.slice(1);
  let lastPhoto = rest[rest.length - 1] || photos[0];
  for (let i = 0; i < rest.length; i += 2) {
    if (i + 1 < rest.length) {
      spreads.push({ left: rest[i], right: rest[i + 1] });
    } else {
      // odd one out becomes the closing back-cover panel instead of a half-empty page
      spreads.push({ isBackCover: true, image: rest[i] });
    }
  }
  if (rest.length % 2 === 0) {
    spreads.push({ isBackCover: true, image: lastPhoto });

function renderSpread(index) {
  const spread = spreads[index];

  const leaf = document.createElement('div');
  leaf.className = 'leaf';

  if (spread.isCover) {
    leaf.innerHTML = coverLeafHTML();
    spineEl.classList.add('hidden');
  } else if (spread.isBackCover) {
    leaf.innerHTML = backCoverLeafHTML(spread.image);
    spineEl.classList.add('hidden');
  } else {
    leaf.innerHTML = halfHTML(spread.left, 'left') + halfHTML(spread.right, 'right');
    spineEl.classList.remove('hidden');
  }

  book.appendChild(leaf);
  document.querySelectorAll('.leaf').forEach(el => { if (el !== leaf) el.remove(); });

  counter.textContent = `${index + 1} / ${spreads.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === spreads.length - 1;
}
