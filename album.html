<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nemours Estate — Album</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Special+Elite&display=swap');
  :root{
    --paper:#efe8da;
    --ink:#2b3a55;
    --shadow:rgba(35,28,15,0.4);
    --serif:'Playfair Display', Georgia, serif;
    --type:'Special Elite', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:#1f2a24;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
    font-family:var(--type);
    color:#eee6d3;
  }
  h1{
    font-family:var(--serif);
    font-size:24px;
    margin:0 0 24px;
    text-align:center;
  }
  .book-stage{ perspective:2600px; }
  .book{
    position:relative;
    width:min(90vw, 480px);
    aspect-ratio:3/4;
  }
  .page{
    position:absolute;
    inset:0;
    background:var(--paper);
    border-radius:4px;
    box-shadow:0 20px 45px var(--shadow);
    transform-origin:left center;
    transform-style:preserve-3d;
    transition:transform 0.7s cubic-bezier(.4,.2,.2,1);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .page img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    backface-visibility:hidden;
  }
  .page .cap{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:10px 14px;
    background:linear-gradient(to top, rgba(0,0,0,0.55), transparent);
    color:#f4efe2;
    font-family:var(--serif);
    font-size:14px;
  }
  .page.flipped{ transform:rotateY(-180deg); }
  .page-num{
    position:absolute;
    bottom:8px;
    right:12px;
    font-size:10px;
    color:#eee6d3;
    background:rgba(0,0,0,0.4);
    padding:2px 6px;
    border-radius:3px;
  }
  .loading, .error{
    font-size:12px;
    color:#b9ad92;
    text-align:center;
    padding:40px 10px;
  }
  .controls{
    margin-top:22px;
    display:flex;
    gap:12px;
    align-items:center;
  }
  button{
    font-family:var(--type);
    font-size:12px;
    background:#eee6d3;
    color:#1f2a24;
    border:none;
    border-radius:3px;
    padding:10px 16px;
    cursor:pointer;
  }
  button:disabled{ opacity:0.35; cursor:default; }
  button:hover:not(:disabled){ background:#fff; }
  .counter{ font-size:12px; color:#b9ad92; min-width:60px; text-align:center; }
</style>
</head>
<body>

<h1>Nemours Estate — Album</h1>

<div class="book-stage">
  <div class="book" id="book">
    <div class="loading" id="status">Loading album…</div>
  </div>
</div>

<div class="controls">
  <button id="prevBtn">&larr; Prev</button>
  <span class="counter" id="counter">– / –</span>
  <button id="nextBtn">Next &rarr;</button>
</div>

<script>
/* ---- Config: point this at your GitHub repo/folder ---- */
const GITHUB_OWNER  = "anguyen1601";
const GITHUB_REPO   = "Nemours_Estate";
const GITHUB_BRANCH = "main";
const GITHUB_PATH   = "images/nemours-estate";   // folder containing the photos
const COVER_IMAGE   = `${GITHUB_PATH}/cover.jpg`; // cover image, same folder
const ALBUM_TITLE   = "Delaware - The first state";

const apiUrl  = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}?ref=${GITHUB_BRANCH}`;
const DEFAULT_QR_URL = "https://anguyen1601.github.io/Nemours_Estate/album.html";

const book = document.getElementById('book');
const statusEl = document.getElementById('status');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const counter = document.getElementById('counter');

let pages = [];   // [{src, caption}]
let current = 0;

async function loadAlbum() {
  let photoUrls = [];
  try {
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error('GitHub API error ' + res.status);
    const files = await res.json();
    photoUrls = files
      .filter(f => f.type === 'file' && /\.(jpe?g|png|webp)$/i.test(f.name) && f.name.toLowerCase() !== 'cover.jpg')
      .sort((a, b) => a.name.localeCompare(b.name))
      .map(f => ({ src: `${rawBase}/${GITHUB_PATH}/${f.name}`, caption: f.name.replace(/\.[^.]+$/, '').replace(/_/g, ' ') }));
  } catch (err) {
    statusEl.textContent = 'Could not load images from GitHub.';
    console.error(err);
    return;
  }

  pages = [
    { src: `${rawBase}/${COVER_IMAGE}`, caption: ALBUM_TITLE, isCover: true },
    ...photoUrls
  ];

  if (pages.length === 1) {
    statusEl.textContent = 'No photos found in ' + GITHUB_PATH;
    return;
  }

  buildBook();
}

function buildBook() {
  book.innerHTML = '';
  pages.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'page';
    div.style.zIndex = pages.length - i;
    div.innerHTML = `
      <img src="${p.src}" alt="${p.caption}" loading="lazy">
      <div class="cap">${p.isCover ? p.caption : p.caption}</div>
      <div class="page-num">${i + 1} / ${pages.length}</div>
    `;
    book.appendChild(div);
  });
  render();
}

function render() {
  const pageEls = book.querySelectorAll('.page');
  pageEls.forEach((el, i) => {
    el.classList.toggle('flipped', i < current);
    el.style.zIndex = i < current ? i : pages.length - i;
  });
  counter.textContent = `${current + 1} / ${pages.length}`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === pages.length - 1;
}

prevBtn.addEventListener('click', () => {
  if (current > 0) { current--; render(); }
});
nextBtn.addEventListener('click', () => {
  if (current < pages.length - 1) { current++; render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') nextBtn.click();
  if (e.key === 'ArrowLeft') prevBtn.click();
});

loadAlbum();
</script>

</body>
</html>
